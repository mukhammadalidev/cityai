# citybot.uz — host nginx (VPSda Docker tashqarisida).
#
# Oldindan:
# 1) docker-compose.yml da frontend portni host nginx bilan to'qnashmasin:
#    ports: "127.0.0.1:8080:80"
# 2) deploy/stack.env:
#    DJANGO_ALLOWED_HOSTS=citybot.uz,www.citybot.uz,185.191.141.207,localhost,127.0.0.1,frontend,backend
#    CORS_ALLOWED_ORIGINS=https://citybot.uz,https://www.citybot.uz,http://185.191.141.207
#    CSRF_TRUSTED_ORIGINS=https://citybot.uz,https://www.citybot.uz,http://185.191.141.207
# 3) Nusxa: sudo cp deploy/nginx-citybot.uz.conf /etc/nginx/sites-available/citybot.uz
#    sudo ln -sf /etc/nginx/sites-available/citybot.uz /etc/nginx/sites-enabled/
# 4) SSL: sudo certbot certonly --webroot -w /var/www/certbot -d citybot.uz -d www.citybot.uz
#    (birinchi marta webroot: sudo mkdir -p /var/www/certbot)
#    yoki: sudo certbot --nginx -d citybot.uz -d www.citybot.uz
# 5) sudo nginx -t && sudo systemctl reload nginx
#
# Agar SSL hali bo'lmasa: pastdagi 443 server blokini va 80 dagi return 301 ni vaqtincha
# o'chirib, faqat "listen 80" ichida proxy_pass qoldiring.

upstream cityai_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name citybot.uz www.citybot.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name citybot.uz www.citybot.uz;

    ssl_certificate /etc/letsencrypt/live/citybot.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/citybot.uz/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25M;

    location / {
        proxy_pass http://cityai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
