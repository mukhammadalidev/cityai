# citybot.uz — faqat HTTP (Let's Encrypt dan OLDIN).
# fullchain.pem xatosi bo'lsa shu faylni o'rnating, certbotdan keyin nginx-citybot.uz.conf ga o'ting.
#
# 1) sudo mkdir -p /var/www/certbot
# 2) sudo cp deploy/nginx-citybot.uz.http-only.conf /etc/nginx/sites-available/citybot.uz
#    sudo ln -sf /etc/nginx/sites-available/citybot.uz /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) Sertifikat:
#    sudo certbot certonly --webroot -w /var/www/certbot -d citybot.uz -d www.citybot.uz
# 5) HTTPS: sudo cp deploy/nginx-citybot.uz.conf /etc/nginx/sites-available/citybot.uz
#    sudo nginx -t && sudo systemctl reload nginx

upstream cityai_frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name citybot.uz www.citybot.uz;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://cityai_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
}
