# Production: nginx (frontend) + Django (gunicorn). SQLite va media — volume.
#
# 1. deploy/stack.env yarating: cp deploy/stack.env.example deploy/stack.env
#    Ildizdagi .env ichida $ bo‘lmasin (Compose noto‘g‘ri o‘qiydi) yoki .env ni rename qiling.
# 2. docker compose up -d --build
# 3. Superuser: docker compose exec backend python manage.py createsuperuser
#
# Juda eski docker-compose faqat 3.3 (yoki 2.2) ni qabul qiladi — 3.8 "unsupported" beradi.
version: "3.3"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./deploy/stack.env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
    volumes:
      - app_data:/data
      - app_media:/app/media
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_RELATIVE_API: "1"
        # Kam RAM (1 GB VPS): NODE_MEMORY_MB=1024 docker-compose build frontend
        NODE_MEMORY_MB: "${NODE_MEMORY_MB:-2048}"
    # Eski docker-compose v1: ${VAR:-80} ishlamaydi. Boshqa port: masalan "8080:80"
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  app_data:
  app_media:
