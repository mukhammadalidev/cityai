# Production: nginx (frontend) + Django (gunicorn). SQLite va media — volume.
#
# 1. deploy/stack.env yarating: cp deploy/stack.env.example deploy/stack.env
#    Ildizdagi .env ichida $ bo‘lmasin (Compose noto‘g‘ri o‘qiydi) yoki .env ni rename qiling.
# 2. docker compose up -d --build
# 3. Superuser: docker compose exec backend python manage.py createsuperuser
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Sekin VPS: ildizda .env da PIP_INDEX_URL yoki bir martalik:
      #   PIP_INDEX_URL=https://pypi.mirrors.ustc.edu.cn/simple docker-compose build backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    env_file:
      - ./deploy/stack.env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
    volumes:
      - app_data:/data
      - app_media:/app/media
    # HTTP /api/health/ ba’zan ALLOWED_HOSTS yoki sekin migrate tufayli muvaffaqiyatsiz —
    # faqat 8000-port ochiqmi tekshiramiz (gunicorn tayyor).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 120s
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_RELATIVE_API: "1"
        VITE_TELEGRAM_BOT_URL: "https://t.me/citybotuz_bot"
        # docker-compose v1: ${VAR:-default} ba’zan build.args da bo‘sh qoladi — heap ~512MB.
        # 2 GB RAM VPS: 2048 odatda yetadi; kernel OOM bo‘lsa 1792 yoki 512MB+ swap.
        NODE_MEMORY_MB: "2048"
    # Host nginx (deploy/nginx-citybot.uz.conf) upstream: 127.0.0.1:8080.
    # 80:80 qoldirsangiz proksi 8080 ga tushadi, Docker esa 80 da — sayt eski/bo‘sh joyga ketishi mumkin.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: always

volumes:
  app_data:
  app_media:
