# Production: nginx (frontend) + Django (gunicorn). SQLite va media — volume.
#
# 1. Ildizda .env yarating (deploy/env.example dan).
# 2. docker compose up -d --build
# 3. Superuser: docker compose exec backend python manage.py createsuperuser
#
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SQLITE_PATH: /data/db.sqlite3
    volumes:
      - app_data:/data
      - app_media:/app/media
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_USE_RELATIVE_API: "1"
    # Eski docker-compose v1: ${VAR:-80} ishlamaydi. Boshqa port: masalan "8080:80"
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:
  app_media:
